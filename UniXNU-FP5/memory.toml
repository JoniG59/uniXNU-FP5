# FP5 public reference memory configuration.
# This is a source record for the board DTS and the FP5 memory-map checker;
# UniXNU's build currently consumes the matching values in board.toml/FP5.dts.
schema_version = 1

[dram]
base = "0x80000000"
size = "0x200000000"
end_inclusive = "0x27fffffff"
confidence = "public-reference"
source = "FOSDEM 2024 Luca Weiss slide: edited /proc/iomem on fairphone-fp5"
note = "One contiguous 8-GiB System RAM aperture. Factory DTB /memory is zero-filled by the bootloader and does not contradict this reference."

[bringup]
enabled_cpus = 1
darwinboot_owned_memory_size = "0x40000000"
confidence = "provisional-policy"
note = "1-GiB initial XNU-owned allocation window; not a hardware reservation. Increase only after the UEFI map and XNU high-water use are observable."

